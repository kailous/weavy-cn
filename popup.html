<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weavy 汉化控制面板</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header">
    <div class="logo">
      <img src="icon.png" alt="Weavy Logo" width="24" height="24" />
      <h2>Weavy 汉化</h2>
    </div>
  </div>

  <div class="section main-toggle-section">
    <div class="toggle-text">
      <h3>全局汉化开关</h3>
      <p class="status-indicator" id="status-text">正在加载配置...</p>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-i18n">
      <span class="slider round"></span>
    </label>
  </div>

  <div class="section">
    <h3 class="section-title">快捷导航列表</h3>
    <p class="section-desc">快速访问预设资源页面</p>
    <ul id="link-list" class="nav-links">
      <!-- 链接内容通过 JS 动态渲染 -->
    </ul>
  </div>

  <script src="popup.js"></script>
</body>

</html>
