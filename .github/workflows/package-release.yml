name: Package and Release

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version from manifest.json
        id: get_version
        run: |
          VERSION=$(grep '"version":' manifest.json | head -1 | awk -F '"' '{print $4}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Extension ZIP
        run: |
          ZIP_NAME="weavy-cn-v${{ env.VERSION }}.zip"
          # 打包排除： git 目录、开发工具、备份文件、未翻译词条、系统文件等
          zip -r $ZIP_NAME . -x "*.git*" "tools/*" "lang/new.json" "lang/*backup.json" ".gitignore" "agent.md" ".github/*" "README.md"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Extract Changelog Section
        run: |
          # 提取 CHANGELOG.md 中对应版本的内容
          # 从 ## [VERSION] 开始，到下一个 ## [ 结束
          awk "/## \[${{ env.VERSION }}\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > release_body.txt
          
          # 如果提取内容为空，写入默认提示
          if [ ! -s release_body.txt ]; then
            echo "详情请参考 CHANGELOG.md" > release_body.txt
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Weavy 汉化 v${{ env.VERSION }}"
          draft: false
          prerelease: false
          files: ${{ env.ZIP_NAME }}
          body_path: release_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
